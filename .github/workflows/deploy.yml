name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore SafeMind.sln

      - name: Build solution
        run: dotnet build SafeMind.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SafeMind.Tests/SafeMind.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx

      - name: Publish application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish SafeMind/SafeMind.csproj --configuration Release --output ./publish

      - name: Inject production connection string
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          HASHING_KEY: ${{ secrets.HASHING_KEY }}
        run: |
          python3 -c "
          import json, os
          path = './publish/appsettings.Production.json'
          with open(path) as f:
              cfg = json.load(f)
          cfg['ConnectionStrings']['DefaultConnection'] = os.environ['DB_CONNECTION_STRING']
          cfg.setdefault('Authentication', {}).setdefault('Google', {})
          cfg['Authentication']['Google']['ClientId'] = os.environ['GOOGLE_CLIENT_ID']
          cfg['Authentication']['Google']['ClientSecret'] = os.environ['GOOGLE_CLIENT_SECRET']
          cfg.setdefault('Hashing', {})['Key'] = os.environ['HASHING_KEY']
          with open(path, 'w') as f:
              json.dump(cfg, f, indent=2)
          "

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: safemind-app
          path: ./publish

  deploy:
    needs: build-and-test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: safemind-app
          path: ./publish

      - name: Remove app_offline.htm from publish output
        run: Remove-Item -Path ".\publish\app_offline.htm" -ErrorAction SilentlyContinue

      - name: Deploy to SmarterASP.NET via Web Deploy
        shell: pwsh
        env:
          SMARTERASP_SITE_NAME: ${{ secrets.SMARTERASP_SITE_NAME }}
          SMARTERASP_HOST: ${{ secrets.SMARTERASP_HOST }}
          SMARTERASP_USERNAME: ${{ secrets.SMARTERASP_USERNAME }}
          SMARTERASP_PASSWORD: ${{ secrets.SMARTERASP_PASSWORD }}
        run: |
          $msdeploy = 'C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe'
          $argString = (
            '-verb:sync',
            "-source:contentPath=`"$env:GITHUB_WORKSPACE\publish`"",
            "-dest:contentPath=`"$env:SMARTERASP_SITE_NAME`",computerName=`"https://$($env:SMARTERASP_HOST):8172/MsDeploy.axd?site=$($env:SMARTERASP_SITE_NAME)`",userName=`"$env:SMARTERASP_USERNAME`",password=`"$env:SMARTERASP_PASSWORD`",authType=`"Basic`"",
            '-enableRule:AppOffline',
            '-useCheckSum',
            '-disableLink:AppPoolExtension',
            '-retryAttempts:3',
            '-retryInterval:2000',
            '-allowUntrusted'
          ) -join ' '
          $process = Start-Process -FilePath $msdeploy -ArgumentList $argString -Wait -PassThru -NoNewWindow
          exit $process.ExitCode
