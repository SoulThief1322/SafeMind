name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore SafeMind.sln

      - name: Build solution
        run: dotnet build SafeMind.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SafeMind.Tests/SafeMind.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx

      - name: Publish application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish SafeMind/SafeMind.csproj --configuration Release --output ./publish

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: safemind-app
          path: ./publish

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: safemind-app
          path: ./publish

      - name: Remove app_offline.htm from publish
        run: rm -f ./publish/app_offline.htm

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Create app_offline.htm
        run: echo '<!DOCTYPE html><html><body><h1>Updating...</h1></body></html>' > app_offline.htm

      - name: Deploy to SmarterASP.NET via FTPS
        run: |
          lftp -u "${{ secrets.SMARTERASP_USERNAME }},${{ secrets.SMARTERASP_PASSWORD }}" \
            -e "
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate false;
              set net:timeout 60;
              set net:max-retries 10;
              set net:reconnect-interval-base 5;
              set ftp:passive-mode true;
              mirror --reverse --verbose --parallel=2 ./publish/ /;
              quit;
            " "ftp://${{ secrets.SMARTERASP_HOST }}"
