name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore SafeMind.sln

      - name: Build solution
        run: dotnet build SafeMind.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SafeMind.Tests/SafeMind.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx

      - name: Publish application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish SafeMind/SafeMind.csproj --configuration Release --output ./publish

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: safemind-app
          path: ./publish

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: safemind-app
          path: ./publish

      - name: Enable stdout logging in web.config
        run: |
          sed -i 's/stdoutLogEnabled="false"/stdoutLogEnabled="true"/' ./publish/web.config
          sed -i 's/hostingModel="inprocess"/hostingModel="outofprocess"/' ./publish/web.config

      - name: Write production appsettings
        run: |
          python3 -c "
          import json, os
          config = {
            'ConnectionStrings': {'DefaultConnection': os.environ['DB_CONNECTION_STRING'].strip()},
            'SmtpSettings': {'Host': 'smtp-relay.brevo.com', 'Port': 587, 'Username': os.environ['SMTP_USERNAME'].strip(), 'Password': os.environ['SMTP_PASSWORD'].strip()},
            'Hashing': {'Key': os.environ['HASHING_KEY']},
            'Authentication': {'Google': {'ClientId': os.environ['GOOGLE_CLIENT_ID'], 'ClientSecret': os.environ['GOOGLE_CLIENT_SECRET']}},
            'Logging': {'LogLevel': {'Default': 'Warning', 'Microsoft.AspNetCore': 'Warning'}},
            'AllowedHosts': '*'
          }
          with open('./publish/appsettings.Production.json', 'w') as f:
            json.dump(config, f, indent=2)
          "
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          HASHING_KEY: ${{ secrets.HASHING_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to SmarterASP.NET via FTPS
        run: |
          lftp -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate false; set net:timeout 60; set net:max-retries 3; set net:reconnect-interval-base 5; set ftp:passive-mode true; open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST; mirror --reverse --verbose --no-perms --delete --parallel=2 ./publish/ /site1/; quit;"
        env:
          FTP_USER: ${{ secrets.SMARTERASP_USERNAME }}
          FTP_PASS: ${{ secrets.SMARTERASP_PASSWORD }}
          FTP_HOST: ${{ secrets.SMARTERASP_HOST }}


